# Serves the built SPA. react-router needs the index.html fallback so deep links
# (e.g. /courses/123) resolve client-side instead of 404-ing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # long-cache fingerprinted build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
