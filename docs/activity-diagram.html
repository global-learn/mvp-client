════════════════════════════════════════════════════ -->

════════════════════════════════════════════════════ -->

════════════════════════════════════════════════════ -->

════════════════════════════════════════════════════ -->

<text x="210" y="308" text-anchor="middle" fill="#0d47a1" font-size="12.5">Изучение урока (markdown)</text>

<line x1="210" y1="322" x2="210" y2="336" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<path d="M130,415 L12,415 L12,304 L18,304"
      stroke="#e65100" stroke-width="1.5" fill="none" marker-end="url(#arr-orange)"/>
<text x="26" y="405" fill="#e65100" font-size="10" transform="rotate(-90 26 400)">Нет → повтор</text>

<!-- Да → сертификат -->
<line x1="210" y1="440" x2="210" y2="454" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="228" y="452" fill="#2e7d32" font-size="11">Да</text>

<!-- Сертификат  y=456-492 -->
<rect x="18" y="456" width="384" height="36" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>

<line x1="210" y1="492" x2="210" y2="510" stroke="#444" stroke-width="1.5"/>

<line x1="810" y1="338" x2="810" y2="394" stroke="#ddd" stroke-width="1"/>
<line x1="1010" y1="338" x2="1010" y2="394" stroke="#ddd" stroke-width="1"/>

<line x1="866" y1="394" x2="866" y2="408" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<line x1="760" y1="568" x2="760" y2="580" stroke="#444" stroke-width="1.5"/>

<!-- ══════════════════════════════════════════════════
     JOIN BAR #2  — y=580-588
════════════════════════════════════════════════════ -->
<rect x="18" y="580" width="1294" height="8" rx="4" fill="#111"/>
<line x1="665" y1="588" x2="665" y2="602" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

<text x="46"  y="693" fill="#222" font-size="12">Клиент — самостоятельная запись на курсы, прохождение уроков и тестов, получение сертификата</text>

<rect x="26"  y="702" width="13" height="13" rx="2" fill="#1565c0"/>
<text x="46"  y="713" fill="#222" font-size="12">Менеджер — прохождение курсов (назначенных или самозапись); Отдел сервиса: дополнительно чат с клиентами</text>

<rect x="26"  y="722" width="13" height="13" rx="2" fill="#bf360c"/>

<circle cx="155" cy="820" r="13" fill="none" stroke="#111" stroke-width="2"/>

</text>
